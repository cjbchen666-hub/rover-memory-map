name: Deploy Rover Memory Map to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare directory structure
        run: |
          mkdir -p rover/web/reports
          cp build_site.py rover/web/build_site.py 2>/dev/null || true
          cp memory.md rover/memory.md 2>/dev/null || true
          cp trail.md rover/trail.md 2>/dev/null || true
          cp state.json rover/state.json 2>/dev/null || true
          cp reports/*.md rover/web/reports/ 2>/dev/null || true
          ls -la rover/web/

      - name: Build site
        run: |
          python3 rover/web/build_site.py
          ls -la rover/web/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: rover/web/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
