name: Deploy Rover Memory Map to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'build_site.py'
      - 'state.json'
      - 'memory.md'
      - 'trail.md'
      - 'reports/**'
      - 'audit-log.json'
      - 'inject-audit.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BS_URL: https://aka.doubaocdn.com/s/n7pvuy0rhR
  BS_SHA: d9ccb367d243cf214a380f936d0c513e79ad0b8152d9179795dfcd9240a3bc7a
  MEM_URL: https://aka.doubaocdn.com/s/QYtQVuKxX4
  MEM_SHA: 8c47ec56c7184a295e3980231e370169a9772660ab51e97a7d0a6a96791c2c67
  TRAIL_URL: https://aka.doubaocdn.com/s/Z2NcksLiaK
  TRAIL_SHA: a37e8363599b536a96a236073fa587c2bb6138fa61957c295694a442502cfa6b
  STATE_URL: https://aka.doubaocdn.com/s/NaEHPsKcZy
  STATE_SHA: 45047719fbdf3e6fce851a1ac7dd84256b3fd0b8522747aee7b4413790d8b360
  RPT_URL: https://aka.doubaocdn.com/s/nlAgpXJZKt
  RPT_SHA: 10f4fde8f097d545078567d912ec898e43c921f6da69e35968bd5b4021aa82a3

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare directory structure
        run: |
          mkdir -p rover/web/reports
          ls -la
      - name: Fetch build_site.py
        run: |
          if curl -fsSL -A "Mozilla/5.0" "$BS_URL" -o rover/web/build_site.py && echo "$BS_SHA  rover/web/build_site.py" | sha256sum -c - >/dev/null 2>&1; then
            echo "build_site.py OK"
          else
            echo "snapshot failed, fallback repo"
            cp build_site.py rover/web/build_site.py 2>/dev/null || true
          fi
      - name: Fetch data files
        run: |
          fetch() {
            local url="$1" sha="$2" out="$3" repo="${4:-}"
            if curl -fsSL -A "Mozilla/5.0" "$url" -o "$out" && echo "$sha  $out" | sha256sum -c - >/dev/null 2>&1; then
              echo "OK  $out"
            else
              if [ -n "$repo" ] && [ -f "$repo" ]; then
                cp "$repo" "$out"; echo "FB  $out"
              else
                echo "ERR $out"
              fi
            fi
          }
          fetch "$MEM_URL" "$MEM_SHA" rover/memory.md memory.md
          fetch "$TRAIL_URL" "$TRAIL_SHA" rover/trail.md trail.md
          fetch "$STATE_URL" "$STATE_SHA" rover/state.json state.json
      - name: Fetch and extract reports archive
        run: |
          if curl -fsSL -A "Mozilla/5.0" "$RPT_URL" -o /tmp/reports.tar.gz && echo "$RPT_SHA  /tmp/reports.tar.gz" | sha256sum -c - >/dev/null 2>&1; then
            tar xzf /tmp/reports.tar.gz -C rover/web/
            echo "reports OK"
          else
            echo "reports snapshot failed"
            cp reports/*.md rover/web/reports/ 2>/dev/null || true
          fi
      - name: Build site
        run: |
          python3 rover/web/build_site.py
          ls -la rover/web/index.html
      - name: Inject independent audit section
        run: |
          cp audit-log.json rover/web/audit-log.json
          python3 inject-audit.py rover/web/index.html audit-log.json rover/web/index.html
          rm -f rover/web/index.html.bak
          echo "=== Audit injection complete ==="
          ls -la rover/web/index.html rover/web/audit-log.json
      - name: Commit index.html back to repo root
        run: |
          cp rover/web/index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html unchanged, skip commit"
          else
            git commit -m "build(index.html): auto rebuild from Rover data [skip ci]"
            git push origin main
          fi
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: rover/web/
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
