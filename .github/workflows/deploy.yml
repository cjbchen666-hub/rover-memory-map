name: Deploy Rover Memory Map to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'build_site.py'
      - 'state.json'
      - 'memory.md'
      - 'trail.md'
      - 'reports/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # ============ 数据快照（Rover 上传至 aka 短链，带 SHA256 校验）============
  # 布局重构版 build_site.py（本地 126044B 与 URL 内容 SHA 一致）
  BS_URL: https://aka.doubaocdn.com/s/w6sHPD5snU
  BS_SHA: aab2ee32e608932d0fe82b84443f2e334adfba4d67069fe571942fef3dfd10d3
  MEM_URL: https://aka.doubaocdn.com/s/HKr1JpBhBB
  MEM_SHA: 380710df750092c30584c2497a78eb7abd64958795d1ca0701815cd0a901205e
  TRAIL_URL: https://aka.doubaocdn.com/s/i3zuHOut5q
  TRAIL_SHA: 4d753c2a2152713772153503ed02f257e9375efaf069e0622b8b1f1e5b3fb57e
  STATE_URL: https://aka.doubaocdn.com/s/GQ1WNCciRv
  STATE_SHA: f57474ba224dde317df36222286b52a611fcb3075aa3099d48aa5369714566cd
  RPT0950_URL: https://aka.doubaocdn.com/s/KFHnEqu1dH
  RPT0950_SHA: e421244d0570f2f02b22e997b1d655e1862c429edac3c4c2b15940bd1caa5b2d
  RPT1200_URL: https://aka.doubaocdn.com/s/Pj7ufZ0RgQ
  RPT1200_SHA: cab68f3309f4140fb551cbb91321dbb04f099f2b9fd81a254c45b488714087f3
  RPT1218_URL: https://aka.doubaocdn.com/s/oxOxsYVa45
  RPT1218_SHA: 8b930f005b6c0ba0f0d4288d76f092b10c5b5b43e4fc63b637a461da8616ea15
  RPT1500_URL: https://aka.doubaocdn.com/s/zrHpigbAin
  RPT1500_SHA: f54c984a399f6a8df02d89fe1c09de2ad7c8b14177fb09912496736ee50e0a6e
  RPT1800_URL: https://aka.doubaocdn.com/s/zE0j9VaHMP
  RPT1800_SHA: 4b043fdccbe3fb58cf088e7ce35691f8235ee0bad0932e8e976b7af399ef28ae
  RPT2100_URL: https://aka.doubaocdn.com/s/gA7Xg0dJAx
  RPT2100_SHA: 3a965562cea78c052643430344d257d646ee9cadebe78d71eca765859263db3c

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare directory structure
        run: |
          mkdir -p rover/web/reports
          ls -la

      - name: Fetch latest build_site.py (snapshot, fallback to repo)
        run: |
          if curl -fsSL -A "Mozilla/5.0" "$BS_URL" -o rover/web/build_site.py && echo "$BS_SHA  rover/web/build_site.py" | sha256sum -c - >/dev/null 2>&1; then
            echo "build_site.py fetched from snapshot OK ($(wc -c < rover/web/build_site.py) bytes)"
          else
            echo "snapshot fetch failed, falling back to repo file"
            cp build_site.py rover/web/build_site.py 2>/dev/null || true
            wc -c rover/web/build_site.py
          fi

      - name: Fetch data files (snapshot, fallback to repo)
        run: |
          fetch() {
            local url="$1" sha="$2" out="$3" repo="${4:-}"
            if curl -fsSL -A "Mozilla/5.0" "$url" -o "$out" && echo "$sha  $out" | sha256sum -c - >/dev/null 2>&1; then
              echo "OK  $out ($(wc -c < "$out") bytes)"
            else
              if [ -n "$repo" ] && [ -f "$repo" ]; then
                cp "$repo" "$out"
                echo "FB  $out <- $repo ($(wc -c < "$out") bytes)"
              else
                echo "ERR $out no fallback"
              fi
            fi
          }
          fetch "$MEM_URL" "$MEM_SHA" rover/memory.md memory.md
          fetch "$TRAIL_URL" "$TRAIL_SHA" rover/trail.md trail.md
          fetch "$STATE_URL" "$STATE_SHA" rover/state.json state.json
          fetch "$RPT0950_URL" "$RPT0950_SHA" rover/web/reports/2026-09-12-0950.md reports/2026-09-12-0950.md
          fetch "$RPT1200_URL" "$RPT1200_SHA" rover/web/reports/2026-09-12-1200.md reports/2026-09-12-1200.md
          fetch "$RPT1218_URL" "$RPT1218_SHA" rover/web/reports/2026-09-12-1218.md reports/2026-09-12-1218.md
          fetch "$RPT1500_URL" "$RPT1500_SHA" rover/web/reports/2026-09-12-1500.md reports/2026-09-12-1500.md
          fetch "$RPT1800_URL" "$RPT1800_SHA" rover/web/reports/2026-09-12-1800.md reports/2026-09-12-1800.md
          fetch "$RPT2100_URL" "$RPT2100_SHA" rover/web/reports/2026-09-12-2100.md reports/2026-09-12-2100.md
          echo "--- files ---"
          ls -la rover rover/web rover/web/reports

      - name: Build site
        run: |
          python3 rover/web/build_site.py
          ls -la rover/web/index.html

      - name: Commit index.html back to repo root (branch-based Pages fallback)
        run: |
          cp rover/web/index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html unchanged, skip commit"
          else
            git commit -m "build(index.html): auto rebuild from Rover data [skip ci]"
            git push origin main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: rover/web/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
