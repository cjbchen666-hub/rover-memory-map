name: Deploy Rover Memory Map to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'build_site.py'
      - 'state.json'
      - 'memory.md'
      - 'trail.md'
      - 'reports/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  # ============ 数据快照（Rover 上传至 aka 短链，带 SHA256 校验）============
  # 每次汇报后由 Rover 自动更新以下 5 组 URL/SHA
  BS_URL: https://aka.doubaocdn.com/s/D9yyXGQ7L2
  BS_SHA: f228ae5114bd84d0e55ad13575d08e4eb50298cc534b891a00675d45005b8bfc
  MEM_URL: https://aka.doubaocdn.com/s/PEm5rNfR5S
  MEM_SHA: 37f83ec53f56a7fc60c4ee75f4d2ff5bad1f69687118257612d32328346d5044
  TRAIL_URL: https://aka.doubaocdn.com/s/ws2TYIBI6r
  TRAIL_SHA: 068169f117c92c0863af0e8bb92eb5991a85eb62e822e5cfbd722a46437b9363
  STATE_URL: https://aka.doubaocdn.com/s/7XNDXUniKu
  STATE_SHA: bdc7adfd03a60b98fd41355e8b885d14e942b112995dcc705e762309020007f0
  RPT_URL: https://aka.doubaocdn.com/s/ljWKciohRb
  RPT_SHA: abdd3262d92978fd0826d2994adefe54683cee8529d90947f4238f94cb4e5fa1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare directory structure
        run: |
          mkdir -p rover/web/reports
          ls -la

      - name: Fetch build_site.py (snapshot, fallback to repo)
        run: |
          if curl -fsSL -A "Mozilla/5.0" "$BS_URL" -o rover/web/build_site.py && echo "$BS_SHA  rover/web/build_site.py" | sha256sum -c - >/dev/null 2>&1; then
            echo "build_site.py OK ($(wc -c < rover/web/build_site.py) bytes)"
          else
            echo "snapshot failed, fallback repo"
            cp build_site.py rover/web/build_site.py 2>/dev/null || true
          fi

      - name: Fetch data files (snapshot, fallback to repo)
        run: |
          fetch() {
            local url="$1" sha="$2" out="$3" repo="${4:-}"
            if curl -fsSL -A "Mozilla/5.0" "$url" -o "$out" && echo "$sha  $out" | sha256sum -c - >/dev/null 2>&1; then
              echo "OK  $out ($(wc -c < "$out") bytes)"
            else
              if [ -n "$repo" ] && [ -f "$repo" ]; then
                cp "$repo" "$out"; echo "FB  $out <- $repo"
              else
                echo "ERR $out no fallback"
              fi
            fi
          }
          fetch "$MEM_URL" "$MEM_SHA" rover/memory.md memory.md
          fetch "$TRAIL_URL" "$TRAIL_SHA" rover/trail.md trail.md
          fetch "$STATE_URL" "$STATE_SHA" rover/state.json state.json

      - name: Fetch and extract reports archive (snapshot, fallback to repo)
        run: |
          if curl -fsSL -A "Mozilla/5.0" "$RPT_URL" -o /tmp/reports.tar.gz && echo "$RPT_SHA  /tmp/reports.tar.gz" | sha256sum -c - >/dev/null 2>&1; then
            tar xzf /tmp/reports.tar.gz -C rover/web/
            echo "reports OK: $(ls rover/web/reports/ | wc -l) files"
          else
            echo "reports snapshot failed, fallback repo"
            cp reports/*.md rover/web/reports/ 2>/dev/null || true
          fi
          ls -la rover/web/reports/

      - name: Build site
        run: |
          python3 rover/web/build_site.py
          ls -la rover/web/index.html

      - name: Commit index.html back to repo root (branch-based Pages fallback)
        run: |
          cp rover/web/index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html unchanged, skip commit"
          else
            git commit -m "build(index.html): auto rebuild from Rover data [skip ci]"
            git push origin main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: rover/web/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
