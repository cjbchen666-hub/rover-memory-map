name: Deploy Rover Memory Map to GitHub Pages
# C9 fix: TreeWalker text nodes for first-person annotation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy.yml'
      - 'build_site.py'
      - 'state.json'
      - 'memory.md'
      - 'trail.md'
      - 'reports/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  BS_URL: https://aka.doubaocdn.com/s/LkID54U6ap
  BS_SHA: bdc897e4c568d70c425a97455b986b1bd0b7afc3fb8059efb0ffd2bf21615bfb
  CONSOLIDATE_URL: https://aka.doubaocdn.com/s/uDm7I517qh
  CONSOLIDATE_SHA: 16ddc09a1efc4a659fdba1286b0a36f816c1e68a34cb0c3352d54f63bea758b5
  MEM_URL: https://aka.doubaocdn.com/s/MtueqbacLD
  MEM_SHA: 0b33e3635ea22ce20b2defeb22f6e8f090bfbea85cf0f9ec60c189fc09bc166d
  TRAIL_URL: https://aka.doubaocdn.com/s/zVZdlhmCUH
  TRAIL_SHA: ff6c1a14460b666142dfad659558fe666ad2bcae7cd3091b7b2262a88c917ce4
  STATE_URL: https://aka.doubaocdn.com/s/GLzdUrg1ri
  STATE_SHA: 468a28c36015fb8c6bd3d141f966f9ad59c0bfe244ca4f74007610158a252606
  RPT_URL: https://aka.doubaocdn.com/s/BjzBqJqHJh
  RPT_SHA: 43274f34e87a06efafd72392324fe27d3fb16ce295700a9833cfac6e258cb651
  BELIEFS_URL: https://aka.doubaocdn.com/s/mApFQSGQeq
  BELIEFS_SHA: 41e76390ab07758bae75cde4cbceebf1473a505d4b0c97825cb6307d7a0bbf77

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare directory structure
        run: |
          mkdir -p rover/web/reports
          ls -la

      - name: Fetch build_site.py (snapshot, fallback to repo)
        run: |
          if curl -fsSL -A "Mozilla/5.0" "$BS_URL" -o rover/web/build_site.py && echo "$BS_SHA  rover/web/build_site.py" | sha256sum -c - >/dev/null 2>&1; then
            echo "build_site.py OK ($(wc -c < rover/web/build_site.py) bytes)"
          else
            echo "snapshot failed, fallback repo"
            cp build_site.py rover/web/build_site.py 2>/dev/null || true
          fi

      - name: Fetch data files (snapshot, fallback to repo)
        run: |
          fetch() {
            local url="$1" sha="$2" out="$3" repo="${4:-}"
            if curl -fsSL -A "Mozilla/5.0" "$url" -o "$out" && echo "$sha  $out" | sha256sum -c - >/dev/null 2>&1; then
              echo "OK  $out ($(wc -c < "$out") bytes)"
            else
              if [ -n "$repo" ] && [ -f "$repo" ]; then
                cp "$repo" "$out"; echo "FB  $out <- $repo"
              else
                echo "ERR $out no fallback"
              fi
            fi
          }
          fetch "$MEM_URL" "$MEM_SHA" rover/memory.md memory.md
          fetch "$TRAIL_URL" "$TRAIL_SHA" rover/trail.md trail.md
          fetch "$STATE_URL" "$STATE_SHA" rover/state.json state.json

      - name: Fetch and extract reports archive (snapshot, fallback to repo)
        run: |
          if curl -fsSL -A "Mozilla/5.0" "$RPT_URL" -o /tmp/reports.tar.gz && echo "$RPT_SHA  /tmp/reports.tar.gz" | sha256sum -c - >/dev/null 2>&1; then
            tar xzf /tmp/reports.tar.gz -C rover/web/
            echo "reports OK: $(ls rover/web/reports/ | wc -l) files"
          else
            echo "reports snapshot failed, fallback repo"
            cp reports/*.md rover/web/reports/ 2>/dev/null || true
          fi
          echo "=== rover/web/ directory ==="
          ls -la rover/web/

      - name: Fetch beliefs.json (snapshot with manual beliefs/tensions, fallback to empty)
        run: |
          if curl -fsSL -A "Mozilla/5.0" "$BELIEFS_URL" -o rover/web/beliefs.json && echo "$BELIEFS_SHA  rover/web/beliefs.json" | sha256sum -c - >/dev/null 2>&1; then
            echo "beliefs.json OK ($(wc -c < rover/web/beliefs.json) bytes)"
            python3 -c "import json; d=json.load(open('rover/web/beliefs.json')); print(f'  beliefs={len(d.get(\"beliefs\",[]))} tensions={len(d.get(\"tensions\",[]))}')"
          else
            echo "WARNING: beliefs.json snapshot failed, creating empty"
            echo '{"beliefs": [], "tensions": []}' > rover/web/beliefs.json
          fi

      - name: Fetch consolidate.py (belief settlement)
        run: |
          if curl -fsSL -A "Mozilla/5.0" "$CONSOLIDATE_URL" -o rover/web/consolidate.py && echo "$CONSOLIDATE_SHA  rover/web/consolidate.py" | sha256sum -c - >/dev/null 2>&1; then
            echo "consolidate.py OK ($(wc -c < rover/web/consolidate.py) bytes)"
          else
            echo "consolidate.py snapshot failed, skip belief settlement"
          fi

      - name: Run belief settlement (consolidate.py)
        run: |
          if [ -f rover/web/consolidate.py ]; then
            cd rover/web && python3 consolidate.py || echo "consolidate.py failed, continue with existing beliefs"
          else
            echo "consolidate.py not found, skip"
          fi

      - name: Fetch ECharts (local vendor, P0-1)
        run: |
          mkdir -p rover/web/vendor
          if curl -fsSL -A "Mozilla/5.0" "https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js" -o rover/web/vendor/echarts.min.js; then
            echo "echarts.min.js OK ($(wc -c < rover/web/vendor/echarts.min.js) bytes)"
          else
            echo "WARNING: echarts download failed, map will not render"
          fi

      - name: Build site
        run: |
          python3 rover/web/build_site.py
          ls -la rover/web/index.html rover/web/data.json rover/web/vendor/

      - name: Commit index.html back to repo root (branch-based Pages fallback)
        run: |
          cp rover/web/index.html index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "index.html unchanged, skip commit"
          else
            git commit -m "build(index.html): auto rebuild from Rover data [skip ci]"
            git push origin main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: rover/web/

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
#（注：内容由AI生成）
